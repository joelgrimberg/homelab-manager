---
# Debian / Ubuntu upgrade flow.

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  register: apt_cache
  retries: 3
  delay: 5
  until: apt_cache is succeeded

- name: Perform dist-upgrade
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
    lock_timeout: "{{ package_update_timeout }}"
  register: apt_upgrade

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot if required
  ansible.builtin.reboot:
    msg: "Reboot triggered by Ansible after package upgrade"
    reboot_timeout: "{{ reboot_timeout }}"
    connect_timeout: "{{ reboot_connect_timeout }}"
    post_reboot_delay: "{{ reboot_post_delay }}"
  when: reboot_required_file.stat.exists

- name: Report upgrade result
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} upgraded
      (reboot={{ 'yes' if reboot_required_file.stat.exists else 'no' }})
